<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insta Video Downloader</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h2 { margin-bottom: 20px; color: #38bdf8; }
    input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; margin-bottom: 15px; outline: none; }
    button { width: 96%; padding: 12px; border: none; border-radius: 8px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #0369a1; }
    #result { margin-top: 20px; }
    .dl-btn { display: inline-block; padding: 12px 20px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 15px; }
    video { max-width: 100%; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Instagram Downloader</h2>
    <input type="text" id="url" placeholder="Paste Instagram Link Here...">
    <button onclick="downloadVideo()">Download Now</button>
    <div id="result"></div>
  </div>

  <script>
    window.onload = function() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(window.location.search);
      const link = hash || params.get('url');
      if (link) {
        document.getElementById('url').value = decodeURIComponent(link);
        downloadVideo();
      }
    };

    async function downloadVideo() {
      const input = document.getElementById('url').value.trim();
      const res = document.getElementById('result');
      if (!input) { alert('कृपया इंस्टाग्राम लिंक डालें'); return; }
      
      res.innerHTML = '<p>⏳ वीडियो फेच हो रहा है, कृपया इंतज़ार करें...</p>';

      try {
        const response = await fetch(`https://api.cobalt.tools/api/json`, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ url: input })
        });
        const data = await response.json();

        if (data && data.url) {
          res.innerHTML = `
            <video src="${data.url}" controls autoplay></video><br>
            <a href="${data.url}" target="_blank" download="instagram_video.mp4" class="dl-btn">⬇️ Save Video</a>
          `;
        } else {
          res.innerHTML = '<p style="color:#ef4444;">वीडियो नहीं मिला या लिंक प्राइवेट है।</p>';
        }
      } catch (err) {
        res.innerHTML = '<p style="color:#ef4444;">वीडियो प्रोसेस करने में समस्या आई। पुनः प्रयास करें।</p>';
      }
    }
  </script>
</body>
</html>
