<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insta Video Downloader</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h2 { margin-bottom: 20px; color: #38bdf8; }
    input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; margin-bottom: 15px; outline: none; }
    button { width: 96%; padding: 12px; border: none; border-radius: 8px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Instagram Downloader</h2>
    <input type="text" id="url" placeholder="Paste Instagram Link Here...">
    <button onclick="downloadVideo()">Download Now</button>
  </div>

  <script>
    function downloadVideo() {
      const input = document.getElementById('url').value.trim();
      if (!input) { alert('कृपया लिंक डालें'); return; }
      window.location.replace("https://saveig.app/en#url=" + encodeURIComponent(input));
    }

    window.onload = function() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(window.location.search);
      const link = hash || params.get('url');
      if (link) {
        document.getElementById('url').value = decodeURIComponent(link);
        downloadVideo();
      }
    };
  </script>
</body>
</html>
