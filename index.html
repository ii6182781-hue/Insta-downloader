<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Instagram Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: #1e293b; padding: 25px; border-radius: 14px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 20px; color: #38bdf8; font-size: 22px; }
    input { width: 100%; padding: 13px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; margin-bottom: 15px; outline: none; }
    button { width: 100%; padding: 13px; border: none; border-radius: 8px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    #result { margin-top: 20px; }
    .dl-btn { display: inline-block; width: 100%; padding: 13px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 15px; font-size: 16px; }
    video { width: 100%; max-height: 350px; border-radius: 10px; margin-top: 15px; background: #000; }
    .status { font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚡ Insta Downloader</h2>
    <input type="text" id="url" placeholder="Paste Instagram Link Here...">
    <button onclick="downloadVideo()">Download Now</button>
    <div id="result"></div>
  </div>

  <script>
    window.onload = function() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(window.location.search);
      const link = hash || params.get('url');
      if (link) {
        document.getElementById('url').value = decodeURIComponent(link);
        downloadVideo();
      }
    };

    async function fetchFromSource(apiUrl) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);
      try {
        const res = await fetch(apiUrl, { signal: controller.signal });
        clearTimeout(timeoutId);
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function downloadVideo() {
      const input = document.getElementById('url').value.trim();
      const res = document.getElementById('result');
      if (!input) { alert('कृपया लिंक डालें'); return; }

      res.innerHTML = '<p class="status">⚡ वीडियो फेच हो रहा है, थोड़ा इंतज़ार करें...</p>';

      const clean = input.split('?')[0].replace(/\/$/, '');
      let videoUrl = null;

      // इंजन 1: डायरेक्ट फास्ट एपीआई
      try {
        const data1 = await fetchFromSource(`https://api.vkrdownloader.workers.dev/server?v=${encodeURIComponent(clean)}`);
        if (data1 && data1.data) {
          if (data1.data.downloads && data1.data.downloads.length > 0) {
            videoUrl = data1.data.downloads[0].url;
          } else if (data1.data.url) {
            videoUrl = data1.data.url;
          }
        }
      } catch (e) {}

      // इंजन 2: बैकअप एपीआई (यदि पहला व्यस्त हो)
      if (!videoUrl) {
        try {
          const data2 = await fetchFromSource(`https://instavideosave.net/api/convert?url=${encodeURIComponent(clean)}`);
          if (data2 && data2.url && data2.url.length > 0) {
            videoUrl = data2.url[0].url;
          }
        } catch (e) {}
      }

      // परिणाम दिखाना
      if (videoUrl) {
        res.innerHTML = `
          <video src="${videoUrl}" controls autoplay playsinline></video>
          <a href="${videoUrl}" target="_blank" download="Instagram_Video.mp4" class="dl-btn">⬇️ Download Video</a>
        `;
      } else {
        // यदि दोनों बैकएंड डायरेक्ट लिंक देने से चूकें तो सुरक्षित इनलाइन डाउनलोडर
        res.innerHTML = `
          <p style="color:#f59e0b; margin-bottom: 10px;">सीधा लिंक नहीं मिला, नीचे बटन दबाकर तुरंत डाउनलोड करें:</p>
          <a href="https://saveig.app/en#url=${encodeURIComponent(clean)}" target="_blank" class="dl-btn">🚀 Instant Download</a>
        `;
      }
    }
  </script>
</body>
</html>
